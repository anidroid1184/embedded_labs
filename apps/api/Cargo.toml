[package]
name = "embedded_labs_api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.4", features = ["macros"] }
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower-http = { version = "0.6.4", features = ["cors", "trace"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "json"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }
chrono = { version = "0.4.41", features = ["serde"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
thiserror = "2.0.12"
anyhow = "1.0.98"
tower = "0.5.2"
http = "1.3.1"

[dev-dependencies]
reqwest = { version = "0.12.20", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
